<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Estudiantes | CRUD</title>
	<style>
		:root {
			--azul: #0fd160;
			--azul-claro: #f55f08;
			--texto: #0e243a;
			--fondo: #05eec7;
			--borde: #ff0404;
			--rojo: #ff0000;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			padding: 40px 20px;
			color: var(--texto);
			font-family: Georgia, 'Times New Roman', serif;
			background: linear-gradient(135deg, #409ae4, var(--fondo) 55%, #3ec58b);
		}

		main {
			width: min(100%, 900px);
			margin: 0 auto;
		}

		header {
			padding: 28px;
			color: rgb(155, 44, 44);
			background: var(--azul);
			border-radius: 14px;
			box-shadow: 0 10px 25px rgb(32 48 64 / 18%);
		}

		header p {
			margin-bottom: 0;
			color: #235392;
		}

		h1, h2 {
			margin-top: 0;
		}

		section {
			margin-top: 22px;
			padding: 24px;
			background: rgb(255 255 255 / 88%);
			border: 1px solid var(--borde);
			border-radius: 12px;
			box-shadow: 0 6px 16px rgb(32 48 64 / 8%);
		}

		.formulario {
			display: grid;
			grid-template-columns: repeat(3, 1fr) auto;
			align-items: end;
			gap: 14px;
		}

		.busqueda {
			max-width: 500px;
		}

		.busqueda-campos {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 12px;
		}

		label {
			display: grid;
			gap: 7px;
			font-weight: bold;
		}

		input {
			width: 100%;
			min-height: 42px;
			padding: 9px 11px;
			border: 1px solid #aebdca;
			border-radius: 6px;
			font: inherit;
		}

		input:focus {
			outline: 3px solid #c5def7;
			border-color: var(--azul);
		}

		button {
			min-height: 42px;
			padding: 9px 15px;
			border: 0;
			border-radius: 6px;
			color: white;
			background: var(--azul);
			font: inherit;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover {
			background: #194777;
		}

		.boton-editar {
			color: var(--azul);
			background: white;
			border: 1px solid var(--azul);
		}

		.boton-editar:hover {
			color: white;
		}

		.boton-eliminar {
			background: var(--rojo);
		}

		.boton-eliminar:hover {
			background: #8f3333;
		}

		.acciones-tabla,
		.acciones-modal {
			display: flex;
			gap: 8px;
		}

		.mensaje {
			min-height: 24px;
			margin: 14px 0 0;
			color: var(--azul);
			font-weight: bold;
		}

		.tabla-contenedor {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		th, td {
			padding: 12px 10px;
			border-bottom: 1px solid var(--borde);
		}

		th {
			color: var(--azul);
			background: #f1f6fb;
		}

		dialog {
			width: min(100% - 32px, 480px);
			padding: 24px;
			border: 1px solid var(--borde);
			border-radius: 12px;
			color: var(--texto);
			box-shadow: 0 12px 32px rgb(32 48 64 / 25%);
		}

		dialog::backdrop {
			background: rgb(20 35 50 / 55%);
		}

		.formulario-modal {
			display: grid;
			gap: 14px;
		}

		.acciones-modal {
			justify-content: flex-end;
			margin-top: 8px;
		}

		.boton-cancelar {
			color: var(--texto);
			background: white;
			border: 1px solid var(--borde);
		}

		.boton-cancelar:hover {
			background: var(--azul-claro);
		}

		@media (max-width: 650px) {
			body {
				padding: 24px 14px;
			}

			.formulario,
			.busqueda-campos {
				grid-template-columns: 1fr;
			}

			.acciones-tabla {
				flex-direction: column;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Gestión de estudiantes</h1>
			<p>Buscá, agregá, editá y eliminá estudiantes.</p>
		</header>

		<section>
			<h2>Buscar estudiantes</h2>
			<form id="formularioBusqueda" class="busqueda">
				<label for="buscador">Nombre o apellido:</label>
				<div class="busqueda-campos">
					<input id="buscador" type="search" placeholder="Escribe para buscar">
					<button type="submit">Buscar</button>
				</div>
			</form>
		</section>

		<section>
			<h2>Agregar estudiante</h2>
			<form id="formularioEstudiante" class="formulario">
				<label for="nombre">Nombre:
					<input id="nombre" name="nombre" type="text" required>
				</label>
				<label for="apellido">Apellido:
					<input id="apellido" name="apellido" type="text" required>
				</label>
				<label for="email">Email:
					<input id="email" name="email" type="email" required>
				</label>
				<button type="submit">Agregar estudiante</button>
			</form>
		</section>

		<section>
			<h2>Estudiantes registrados</h2>
			<p id="mensaje" class="mensaje" aria-live="polite"></p>
			<div class="tabla-contenedor">
				<table>
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Apellido</th>
							<th>Email</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody id="tablaEstudiantes"></tbody>
				</table>
			</div>
		</section>
	</main>

	<dialog id="modalEdicion" aria-labelledby="tituloEdicion">
		<h2 id="tituloEdicion">Editar estudiante</h2>
		<form id="formularioEdicion" class="formulario-modal">
			<input id="editId" type="hidden">
			<label for="editNombre">Nombre:
				<input id="editNombre" type="text" required>
			</label>
			<label for="editApellido">Apellido:
				<input id="editApellido" type="text" required>
			</label>
			<label for="editEmail">Email:
				<input id="editEmail" type="email" required>
			</label>
			<div class="acciones-modal">
				<button id="cancelarEdicion" class="boton-cancelar" type="button">Cancelar</button>
				<button type="submit">Guardar cambios</button>
			</div>
		</form>
	</dialog>

	<script src="Ejercicio3 CRUD completo con fetch.js" defer></script>
</body>
</html>
